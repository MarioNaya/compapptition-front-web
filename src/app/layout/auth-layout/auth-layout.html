<div class="auth-shell">

    <div class="wordmark">
      <span>COMP</span><span class="accent">APP</span><span>TITION</span>
    </div>
  </header>

  <main class="auth-main">
    <router-outlet />
  </main>

  <footer class="legal">
    <span class="mono">© {{ year }} · Compapptition · TFG · No comercial</span>
    <nav class="auth-legal-links" aria-label="Enlaces legales">
      <a routerLink="/legal/privacidad">Privacidad</a>
      <span aria-hidden="true">·</span>
      <a routerLink="/legal/aviso-legal">Aviso legal</a>
      <span aria-hidden="true">·</span>
      <a routerLink="/legal/terminos">Términos</a>
      <span aria-hidden="true">·</span>
      <a [href]="supportMailto">Soporte</a>
    </nav>
  </footer>
</div>

<app-toast-host />
